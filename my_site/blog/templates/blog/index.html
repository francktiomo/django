{% extends "base.html" %}

{% block title %}My Blog{% endblock %}

{% block content %}
  <h1>Welcome to my blog</h1>
  {% comment %} <ul>
    {% for post in posts %}
      <li>
        <a href="{% url 'blog:post_detail' post.slug %}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul> {% endcomment %}
{% endblock %}

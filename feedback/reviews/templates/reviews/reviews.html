{% extends "reviews/base.html" %}

{% block title %}Reviews{% endblock %}

{% block content %}
  <h1>List Of Reviews</h1>
  <ul class="reviews-list">
    {% for review in reviews %}
      <li class="review-item"><a href="">{{ review.username }} (Rating: {{ review.rating }})</a></li>
    {% endfor %}
  </ul>
{% endblock %}
